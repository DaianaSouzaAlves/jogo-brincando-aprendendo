<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>BRINCANDO E APRENDENDO</title>

    <!-- Bootstrap 5.3.8 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome (ícones de som e de carregando) -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" rel="stylesheet">
    <!-- Estilos do jogo: base (global) e telas (um bloco por tela) -->
    <link rel="stylesheet" href="assets/css/base.css">
    <link rel="stylesheet" href="assets/css/telas.css">
    <link rel="icon" type="image/x-icon" href="favicon.ico">
</head>

<body data-parte="1">

<!-- Cada tela é uma .parte; trocaParte() (utils.js) mostra uma de cada vez -->
<div class="app py-5 h-100">
    <div class="row h-100 position-relative">

        <!-- PARTE 1: início (logo à esquerda, botão de iniciar à direita) -->
        <div class="col-12 parte parte-1">
            <div class="inicio h-100">
                <img class="logo-jogo" src="assets/img/jogo.png" alt="Brincando e Aprendendo">
                <a href="javascript:void(0);" class="botao-iniciar" aria-label="Iniciar"></a>
            </div>
        </div>

        <!-- PARTE 4: perguntas -->
        <div class="col-12 parte parte-4" style="display: none;">
            <!-- PNG do nível no centro, com o fundo escurecido; some sozinho e deixa a 1ª pergunta -->
            <div class="intro-nivel" style="display: none;">
                <img src="" alt="Nível">
            </div>

            <div class="row h-100">
                <div class="col-12 col-lg-9 d-flex flex-column h-100">
                    <div class="card d-flex flex-column flex-grow-1 my-auto px-5 justify-content-around">
                        <div class="row">
                            <div class="col-12 pergunta mb-2 my-3"></div>
                        </div>
                        <div class="cena d-flex justify-content-center align-items-center gap-2"></div>
                        <div class="col-12">
                            <div class="alternativas d-flex flex-wrap gap-3 justify-content-around"></div>
                        </div>
                    </div>
                </div>
                <!-- personagem: alterna entre menino e menina a cada pergunta -->
                <div class="col-lg-3 d-none d-lg-flex align-items-end justify-content-center h-100">
                    <img class="personagem" src="assets/img/menino.png" alt="personagem">
                </div>
            </div>
        </div>

        <!-- PARTE 5: resultado -->
        <div class="col-12 parte parte-5" style="display: none;">
            <div class="d-flex h-100 align-items-center justify-content-center">
                <div class="painel-resultado">
                    <img class="resultado-personagem" src="assets/img/resultado_bom.png" alt="">
                    <div class="resultado-info">
                        <div class="resultado-acertos"><span class="numero-acertos">0</span> <span class="texto-acertos">ACERTOS!</span></div>
                        <div class="estrelas">
                            <img src="assets/img/nivel/estrela.png" alt="" class="estrela">
                            <img src="assets/img/nivel/estrela.png" alt="" class="estrela">
                            <img src="assets/img/nivel/estrela.png" alt="" class="estrela">
                        </div>
                        <div class="resultado-botoes">
                            <button class="btn btn-success botao-repetir">
                                JOGAR NOVAMENTE
                            </button>
                            <a href="javascript:void(0);" class="botao-proximo" style="display: none;" aria-label="Próximo nível">
                                <img src="assets/img/nivel/proximoNivel.png" alt="Próximo nível">
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>


    </div>
</div>

<!-- Liga/desliga a música de fundo -->
<button type="button" class="botao-musica" aria-label="Música"><i class="fa fa-music"></i></button>

<!-- Bootstrap 5.3.8 JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

<!-- Jquery 4.0.0 -->
<script src="https://code.jquery.com/jquery-4.0.0.min.js"
        integrity="sha256-OaVG6prZf4v69dPg6PhVattBXkcOWQB62pdZ3ORyrao=" crossorigin="anonymous"></script>

<!-- Jogo: utils primeiro; depois uma tela por arquivo (ligacao.js é a pergunta de ligar da tela 4) -->
<script src="assets/js/utils.js"></script>
<script src="assets/js/parte1.js"></script>
<script src="assets/js/parte4.js"></script>
<script src="assets/js/ligacao.js"></script>
<script src="assets/js/parte5.js"></script>

</body>

</html>
