<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>BRINCANDO E APRENDENDO</title>

    <!-- Bootstrap 5.3.8 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome (ícones de som e de carregando) -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" rel="stylesheet">
    <!-- Estilos do jogo: base (global) e telas (um bloco por tela) -->
    <link rel="stylesheet" href="assets/css/base.css">
    <link rel="stylesheet" href="assets/css/telas.css">
    <link rel="icon" type="image/x-icon" href="favicon.ico">
</head>

<body data-parte="1">

<!-- Cada tela é uma .parte; trocaParte() (utils.js) mostra uma de cada vez -->
<div class="app py-5 h-100">
    <div class="row h-100 position-relative">

        <!-- PARTE 1: início (logo à esquerda, botão de iniciar à direita) -->
        <div class="col-12 parte parte-1">
            <div class="inicio h-100">
                <img class="logo-jogo" src="assets/img/jogo.png" alt="Brincando e Aprendendo">
                <a href="javascript:void(0);" class="botao-iniciar" aria-label="Iniciar"></a>
            </div>
        </div>

        <!-- PARTE 4: perguntas -->
        <div class="col-12 parte parte-4" style="display: none;">
            <!-- PNG do nível no centro, com o fundo escurecido; some sozinho e deixa a 1ª pergunta -->
            <div class="intro-nivel" style="display: none;">
                <img src="" alt="Nível">
            </div>

            <div class="row h-100">
                <div class="col-12 col-lg-9 d-flex flex-column h-100">
                    <div class="card d-flex flex-column flex-grow-1 my-auto px-5 justify-content-around">
                        <div class="row">
                            <div class="col-12 pergunta mb-2 my-3"></div>
                        </div>
                        <div class="cena d-flex justify-content-center align-items-center gap-2"></div>
                        <div class="col-12">
                            <div class="alternativas d-flex flex-wrap gap-3 justify-content-around"></div>
                        </div>
                    </div>
                </div>
                <!-- personagem: alterna entre menino e menina a cada pergunta -->
                <div class="col-lg-3 d-none d-lg-flex align-items-end justify-content-center h-100">
                    <img class="personagem" src="assets/img/menino.png" alt="personagem">
                </div>
            </div>
        </div>

        <!-- PARTE 5: resultado -->
        <div class="col-12 parte parte-5" style="display: none;">
            <div class="d-flex h-100 align-items-center justify-content-center">
                <div class="painel-resultado">
                    <img class="resultado-personagem" src="assets/img/resultado_bom.png" alt="">
                    <div class="resultado-info">
                        <div class="resultado-acertos"><span class="numero-acertos">0</span> <span class="texto-acertos">ACERTOS!</span></div>
                        <div class="estrelas">
                            <img src="assets/img/nivel/estrela.png" alt="" class="estrela">
                            <img src="assets/img/nivel/estrela.png" alt="" class="estrela">
                            <img src="assets/img/nivel/estrela.png" alt="" class="estrela">
                        </div>
                        <div class="resultado-botoes">
                            <button class="btn btn-success botao-repetir">
                                JOGAR NOVAMENTE
                            </button>
                            <button class="btn btn-success botao-desafio-final" style="display: none;">DESAFIO FINAL</button>
                            <a href="javascript:void(0);" class="botao-proximo" style="display: none;" aria-label="Próximo nível">
                                <img src="assets/img/nivel/proximoNivel.png" alt="Próximo nível">
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- PARTE 6: final - resumo dos três níveis -->
        <div class="col-12 parte parte-6" style="display: none;">
            <div class="d-flex h-100 align-items-center justify-content-center">
                <div class="palco-final">
                    <div class="painel-final"></div>
                    <img class="final-personagem final-menino" src="assets/img/nivel/MeninoResumo.png" alt="">
                    <img class="final-personagem final-menina" src="assets/img/nivel/MeninaResumo.png" alt="">
                    <img class="final-trofeu" src="assets/img/nivel/trofeu-dourado.png" alt="">
                    <img class="final-titulo" src="assets/img/nivel/titulo-parabens.png" alt="Parabéns!">

                    <div class="final-cards">
                        <div class="resumo-card" data-nivel="facil">
                            <img src="assets/img/nivel/card-facil-base.png" alt="Fácil">
                            <div class="resumo-nota"><b class="acertos">0</b><span>/10</span></div>
                            <div class="resumo-estrelas">
                                <img src="assets/img/nivel/estrela.png" alt="" class="estrela">
                                <img src="assets/img/nivel/estrela.png" alt="" class="estrela">
                                <img src="assets/img/nivel/estrela.png" alt="" class="estrela">
                            </div>
                        </div>
                        <div class="resumo-card" data-nivel="medio">
                            <img src="assets/img/nivel/card-medio-base.png" alt="Médio">
                            <div class="resumo-nota"><b class="acertos">0</b><span>/10</span></div>
                            <div class="resumo-estrelas">
                                <img src="assets/img/nivel/estrela.png" alt="" class="estrela">
                                <img src="assets/img/nivel/estrela.png" alt="" class="estrela">
                                <img src="assets/img/nivel/estrela.png" alt="" class="estrela">
                            </div>
                        </div>
                        <div class="resumo-card" data-nivel="dificil">
                            <img src="assets/img/nivel/card-dificil-base.png" alt="Difícil">
                            <div class="resumo-nota"><b class="acertos">0</b><span>/10</span></div>
                            <div class="resumo-estrelas">
                                <img src="assets/img/nivel/estrela.png" alt="" class="estrela">
                                <img src="assets/img/nivel/estrela.png" alt="" class="estrela">
                                <img src="assets/img/nivel/estrela.png" alt="" class="estrela">
                            </div>
                        </div>
                    </div>

                    <div class="final-botoes">
                        <p class="final-desafio-tempo">DESAFIO FINAL: <strong class="tempo-desafio">00:00</strong></p>
                        <button class="btn btn-success botao-refazer-desafio">REFAZER DESAFIO FINAL</button>
                        <button class="btn btn-success botao-voltar-inicio">VOLTAR AO INÍCIO</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- PARTE 7: desafio final de classificação por letras -->
        <div class="col-12 parte parte-7" style="display: none;">
            <div class="intro-desafio-final" aria-hidden="true" style="display: none;">
                <img src="/manus-storage/async-images/F5lb6gmIxSunLpylOuGYEe/image-1.webp" alt="Desafio final!">
                <span class="intro-desafio-final-fallback" hidden>DESAFIO FINAL!</span>
            </div>

            <section class="desafio-final" aria-labelledby="desafio-titulo">
                <header class="desafio-cabecalho">
                    <p class="desafio-selo"></p>
                    <h1 id="desafio-titulo" class="desafio-titulo">SEPARAR ANIMAIS PELAS LETRAS</h1>
                    <p class="desafio-instrucao"></p>
                    <span class="desafio-letra" aria-label="Letra da rodada"></span>
                    <button type="button" class="btn btn-volume botao-repetir-instrucao" aria-label="Ouvir a instrução de novo"><i class="fa fa-volume-up"></i></button>
                    <p class="desafio-ajuda">OS OUTROS ANIMAIS FICAM À ESQUERDA.</p>
                </header>

                <div class="desafio-tabuleiro">
                    <section class="desafio-zona desafio-zona-nao" data-resposta="nao">
                        <button type="button" class="desafio-zona-escolher" data-resposta="nao" aria-label="Escolher o lado esquerdo">
                            <span class="desafio-seta" aria-hidden="true">←</span>
                        </button>
                        <div class="zona-itens"></div>
                    </section>

                    <div class="desafio-banco" aria-label="Figuras de animais para classificar"></div>

                    <section class="desafio-zona desafio-zona-sim" data-resposta="sim">
                        <button type="button" class="desafio-zona-escolher" data-resposta="sim" aria-label="Escolher o lado direito">
                            <span class="desafio-seta" aria-hidden="true">→</span>
                        </button>
                        <div class="zona-itens"></div>
                    </section>
                </div>

                <footer class="desafio-rodape">
                    <button type="button" class="btn btn-success desafio-proxima" hidden>PRÓXIMA ETAPA</button>
                    <span class="visually-hidden desafio-status" aria-live="polite"></span>
                </footer>
            </section>
        </div>

    </div>
</div>

<!-- Liga/desliga a música de fundo -->
<button type="button" class="botao-musica" aria-label="Música"><i class="fa fa-music"></i></button>

<!-- Jquery 4.0.0 -->
<script src="https://code.jquery.com/jquery-4.0.0.min.js"
        integrity="sha256-OaVG6prZf4v69dPg6PhVattBXkcOWQB62pdZ3ORyrao=" crossorigin="anonymous"></script>

<!-- Jogo: utils primeiro; depois uma tela por arquivo (ligacao.js é a pergunta de ligar da tela 4) -->
<script src="assets/js/utils.js"></script>
<script src="assets/js/parte1.js"></script>
<script src="assets/js/parte4.js"></script>
<script src="assets/js/ligacao.js"></script>
<script src="assets/js/parte5.js"></script>
<script src="assets/js/parte7.js"></script>

</body>

</html>
